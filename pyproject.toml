[project]
name = "clickbust"
version = "0.1.0"
description = "Clickbait headline rewriter — replaces misleading headlines with informative ones"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "feedparser>=6.0",
    "readability-lxml>=0.8",
    "lxml>=5.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.scripts]
clickbust = "clickbust.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["clickbust*"]

[tool.uv]
package = true

[dependency-groups]
dev = []
# Clickbust Configuration
#
# llm: OpenAI-compatible API for headline rewriting
#   Supports any provider: OpenAI, OpenRouter, Anthropic via API proxy, local LM Studio, etc.
#
# sites: list of RSS feeds to monitor for clickbait headlines

llm:
  endpoint: "https://openrouter.ai/api/v1/chat/completions"
  api_key: "${OPENROUTER_API_KEY}"   # Can use env vars or put key directly
  model: "deepseek/deepseek-v4-flash"        # Cheap & fast for headline analysis

sites:
  - name: "ScreenRant"
    rss_url: "https://screenrant.com/feed/"
    site_url: "https://screenrant.com"
    enabled: true

  - name: "Collider"
    rss_url: "https://collider.com/feed"
    site_url: "https://collider.com"
    enabled: true

  - name: "Movieweb"
    rss_url: "https://www.movieweb.com/feed"
    site_url: "https://www.movieweb.com"
    enabled: true

  - name: "Giant Freakin Robot"
    rss_url: "https://www.giantfreakinrobot.com/feed/"
    site_url: "https://www.giantfreakinrobot.com"
    enabled: true

  - name: "CBR"
    rss_url: "https://www.cbr.com/feed/"
    site_url: "https://www.cbr.com"
    enabled: true

  - name: "The Direct"
    rss_url: "https://thedirect.com/rss/"
    site_url: "https://thedirect.com"
    enabled: true

  - name: "Polygon"
    rss_url: "https://www.polygon.com/feed/"
    site_url: "https://www.polygon.com"
    enabled: true

  - name: "BGR"
    rss_url: "https://www.bgr.com/feed/"
    site_url: "https://www.bgr.com"
    enabled: true

  - name: "Looper"
    rss_url: "https://www.looper.com/feed/"
    site_url: "https://www.looper.com"
    enabled: true
social:
  # Bluesky — free, open API, no developer fees
  bluesky:
    handle: "paulkoan.bsky.social"        # e.g., "yourname.bsky.social"
    app_password: "${BLUESKY_APP_PASSWORD}"  # env var — set this in ~/.bashrc or deploy env
    max_per_run: 3                 # max posts per deploy
    enabled: true                  # set to true after configuring handle + app_password

  # X/Twitter — requires xurl CLI + paid API access
  x:
    xurl_app: "clickbust"
    enabled: false

output:
  dir: "output"                     # Where generated files go
  site_title: "Clickbust — Rewritten Headlines"
  site_description: "Clickbait-free headlines from your favourite sites"
  base_url: "https://clickbust.cybr.fi"
  default_banner_url: "https://clickbust.cybr.fi/assets/og-default.svg"  # Fallback OG image when article has no usable image
  max_articles: 500                   # Max articles to keep in the archive
  max_per_site: 10                   # Max articles to fetch per site per run